<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Circle — Sign In</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .auth-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            background:
                linear-gradient(
                    135deg,
                    #f7faf9,
                    #eaf5f2
                );
        }

        .auth-container {
            width: 100%;
            max-width: 440px;

            background: white;

            padding: 40px 32px;

            border-radius: 24px;

            border: 1px solid #e1ebe8;

            box-shadow:
                0 20px 50px
                rgba(25, 70, 65, 0.10);
        }

        .auth-logo {
            text-align: center;

            margin-bottom: 30px;
        }

        .auth-logo .logo {
            justify-content: center;

            margin-bottom: 12px;
        }

        .auth-logo p {
            color: #657572;

            font-size: 14px;
        }

        .auth-tabs {
            display: flex;

            background: #f1f6f4;

            padding: 4px;

            border-radius: 12px;

            margin-bottom: 28px;
        }

        .auth-tab {
            flex: 1;

            padding: 11px;

            border: none;

            background: transparent;

            border-radius: 9px;

            font-weight: 700;

            color: #657572;
        }

        .auth-tab.active {
            background: white;

            color: #2f8f83;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.05);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dce7e4;

            border-radius: 11px;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2f8f83;

            box-shadow:
                0 0 0 3px
                rgba(47, 143, 131, 0.10);
        }

        .auth-submit {
            width: 100%;

            margin-top: 5px;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background: #2f8f83;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        .auth-submit:hover {
            background: #236e65;
        }

        .auth-message {
            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;

            text-align: center;
        }

        .auth-message.success {
            display: block;

            background: #e9f7ef;

            color: #247344;
        }

        .auth-message.error {
            display: block;

            background: #fff0f0;

            color: #b13c3c;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #2f8f83;

            font-size: 14px;

            font-weight: 600;
        }

        .language-auth {
            text-align: center;

            margin-top: 20px;
        }

        .language-auth button {
            border: none;

            background: transparent;

            color: #2f8f83;

            font-weight: 700;

            cursor: pointer;
        }

        @media (max-width: 500px) {

            .auth-container {
                padding: 32px 22px;
            }

        }

    </style>

</head>


<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-logo">

            <div class="logo">

                <span class="logo-mark">◯</span>

                <span>Circle</span>

            </div>

            <p id="authSubtitle">
                Understand your patterns.
            </p>

        </div>


        <div class="auth-tabs">

            <button
                class="auth-tab active"
                id="loginTab"
            >
                Sign In
            </button>

            <button
                class="auth-tab"
                id="signupTab"
            >
                Create Account
            </button>

        </div>


        <!-- LOGIN -->

        <form
            id="loginForm"
            class="auth-form active"
        >

            <div class="form-group">

                <label id="loginEmailLabel">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label id="loginPasswordLabel">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
                id="loginSubmit"
            >
                Sign In
            </button>

        </form>


        <!-- SIGN UP -->

        <form
            id="signupForm"
            class="auth-form"
        >

            <div class="form-group">

                <label id="nameLabel">
                    First Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    required
                    autocomplete="given-name"
                >

            </div>


            <div class="form-group">

                <label id="signupEmailLabel">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label id="signupPasswordLabel">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
                id="signupSubmit"
            >
                Create Account
            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message"
        ></div>


        <a
            href="index.html"
            class="back-home"
            id="backHome"
        >
            ← Back to Circle
        </a>


        <div class="language-auth">

            <button id="authLanguage">
                العربية
            </button>

        </div>

    </div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>

</body>

</html>
